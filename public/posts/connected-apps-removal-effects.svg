<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="What removing an app's access does and does not do">
  <rect width="1000" height="420" rx="24" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="60" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#0f172a">What removing an app does, and does not do</text>
  <rect x="40" y="76" width="72" height="4" rx="2" fill="#e64a19"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(40 110)">
      <rect width="440" height="270" rx="20" fill="#ecfdf5" stroke="#86efac"/>
      <circle cx="44" cy="48" r="20" fill="#16a34a"/><path d="M34 48l7 7 13-14" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="76" y="56" font-size="24" font-weight="800" fill="#14532d">It DOES</text>
      <text x="28" y="116" font-size="19" fill="#1e293b">• Stop the app reading your</text>
      <text x="44" y="142" font-size="19" fill="#1e293b">non-public data through the login</text>
      <text x="28" y="182" font-size="19" fill="#1e293b">• Stop automatic sign-in with it</text>
      <text x="28" y="222" font-size="19" fill="#1e293b">• Leave you only public info shared</text>
    </g>
    <g transform="translate(520 110)">
      <rect width="440" height="270" rx="20" fill="#fef2f2" stroke="#fca5a5"/>
      <circle cx="44" cy="48" r="20" fill="#dc2626"/><path d="M35 39l18 18M53 39l-18 18" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <text x="76" y="56" font-size="24" font-weight="800" fill="#7f1d1d">It does NOT</text>
      <text x="28" y="116" font-size="19" fill="#1e293b">• Delete data the app already saved</text>
      <text x="28" y="156" font-size="19" fill="#1e293b">• Delete your account in that app</text>
      <text x="28" y="196" font-size="19" fill="#1e293b">• Take back what you shared before</text>
      <text x="44" y="222" font-size="19" fill="#1e293b">(ask the app to delete it)</text>
    </g>
  </g>
</svg>
