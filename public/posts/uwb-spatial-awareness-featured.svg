    <tspan x="140" dy="56" fill="url(#titleGlow)">Nanosecond Time-of-Flight &amp; AoA</tspan>
  </text>
  <text x="140" y="275" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
    <tspan x="140" dy="0">Centimetre spatial awareness, Angle of Arrival phase interferometry, pulse-radio physics,</tspan>
    <tspan x="140" dy="30">IEEE 802.15.4z STS cryptographic protection, and relay-proof digital car keys.</tspan>
  </text>
  <g transform="translate(140, 360)">
