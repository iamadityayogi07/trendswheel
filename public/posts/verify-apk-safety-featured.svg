<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#050a14" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#38bdf8" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Technical Circuit Grid -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1.5">
    <path d="M 50 150 L 250 150 L 300 200 L 600 200" fill="none" />
    <path d="M 800 100 L 950 100 L 1000 150 L 1150 150" fill="none" />
    <path d="M 150 500 L 400 500 L 450 450 L 850 450" fill="none" />
    <circle cx="250" cy="150" r="4" fill="#38bdf8" />
    <circle cx="600" cy="200" r="4" fill="#38bdf8" />
    <circle cx="950" cy="100" r="4" fill="#38bdf8" />
    <circle cx="450" cy="450" r="4" fill="#38bdf8" />
  </g>

  <!-- Header Badge -->
  <g transform="translate(80, 75)">
    <rect width="280" height="38" rx="19" fill="#0284c7" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="22" cy="19" r="6" fill="#38bdf8" />
    <text x="40" y="24" fill="#7dd3fc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1">ANDROID SECURITY &amp; PRIVACY</text>
  </g>

  <!-- Title and Subtitle -->
  <g transform="translate(80, 165)">
    <text fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" line-height="1.2">
      <tspan x="0" y="0">How to Verify If an APK File Is Safe</tspan>
      <tspan x="0" y="58" fill="#38bdf8">Before Installing It on Android</tspan>
    </text>
    <text x="0" y="125" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">
      Check SHA-256 Hashes, VirusTotal Multi-Engine Scans &amp; High-Risk Permission Flags
    </text>
  </g>

  <!-- Inspection Blueprint Display Card -->
  <g transform="translate(80, 345)" filter="url(#glow)">
    <rect width="1040" height="215" rx="18" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
    
    <!-- 3 Step Inspection Workflow Columns -->
    <!-- Column 1 -->
    <g transform="translate(30, 25)">
      <rect width="305" height="165" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="1" />
      <circle cx="36" cy="36" r="16" fill="#38bdf8" fill-opacity="0.2" />
      <text x="36" y="42" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">1</text>
      <text x="66" y="36" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="700">VirusTotal Inspection</text>
      <text x="66" y="54" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">70+ Antivirus Engines</text>
      <text x="25" y="90" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" line-height="1.4">
        <tspan x="25" y="90">Upload the .apk file directly</tspan>
        <tspan x="25" y="112">Checks for trojans, spyware &amp;</tspan>
        <tspan x="25" y="134" fill="#f43f5e">flagged dropper malware.</tspan>
      </text>
    </g>

    <!-- Column 2 -->
    <g transform="translate(365, 25)">
      <rect width="305" height="165" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="1" />
      <circle cx="36" cy="36" r="16" fill="#818cf8" fill-opacity="0.2" />
      <text x="36" y="42" text-anchor="middle" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">2</text>
      <text x="66" y="36" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="700">SHA-256 Hash Check</text>
      <text x="66" y="54" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Cryptographic Signature</text>
      <text x="25" y="90" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" line-height="1.4">
        <tspan x="25" y="90">Compare SHA-256 checksum</tspan>
        <tspan x="25" y="112">with official developer release.</tspan>
        <tspan x="25" y="134" fill="#10b981">Guarantees zero tampering.</tspan>
      </text>
    </g>

    <!-- Column 3 -->
    <g transform="translate(700, 25)">
      <rect width="310" height="165" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="1" />
      <circle cx="36" cy="36" r="16" fill="#f43f5e" fill-opacity="0.2" />
      <text x="36" y="42" text-anchor="middle" fill="#fb7185" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">3</text>
      <text x="66" y="36" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Audit Permissions</text>
      <text x="66" y="54" fill="#fb7185" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Red Flag Permissions</text>
      <text x="25" y="90" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" line-height="1.4">
        <tspan x="25" y="90">Reject apps demanding</tspan>
        <tspan x="25" y="112" fill="#fca5a5">&apos;Accessibility Service&apos; or</tspan>
        <tspan x="25" y="134" fill="#fca5a5">&apos;Read SMS / Notification Access&apos;.</tspan>
      </text>
    </g>
  </g>

  <!-- Footer Branding -->
  <g transform="translate(80, 590)">
    <text fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">TrendsWheel Security • Practical Android Sideloading Safety Guide</text>
  </g>
</svg>
