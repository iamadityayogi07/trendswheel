<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090f1d" />
      <stop offset="50%" stop-color="#141c2e" />
      <stop offset="100%" stop-color="#040812" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#38bdf8" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Cloud outlines in background -->
  <g opacity="0.06" stroke="#38bdf8" stroke-width="1.5" fill="none">
    <path d="M 900 160 A 40 40 0 0 1 970 140 A 50 50 0 0 1 1060 170 A 35 35 0 0 1 1060 230 L 910 230 A 35 35 0 0 1 900 160 Z" />
    <path d="M 120 440 A 40 40 0 0 1 190 420 A 50 50 0 0 1 280 450 A 35 35 0 0 1 280 510 L 130 510 A 35 35 0 0 1 120 440 Z" />
  </g>

  <!-- Header Badge -->
  <g transform="translate(80, 75)">
    <rect width="280" height="38" rx="19" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-width="1.5" />
    <circle cx="22" cy="19" r="6" fill="#38bdf8" />
    <text x="40" y="24" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1">CLOUD STORAGE SHOWDOWN</text>
  </g>

  <!-- Title and Subtitle -->
  <g transform="translate(80, 165)">
    <text fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" line-height="1.2">
      <tspan x="0" y="0">Google One vs iCloud vs OneDrive:</tspan>
      <tspan x="0" y="58" fill="#38bdf8">The Best Cloud Storage in 2026</tspan>
    </text>
    <text x="0" y="125" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">
      Free Tiers, Real Pricing (INR), Photo Compression and Zero-Knowledge Privacy
    </text>
  </g>

  <!-- 4-Provider Matrix Card -->
  <g transform="translate(80, 345)" filter="url(#softGlow)">
    <rect width="1040" height="215" rx="18" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
    
    <!-- Provider 1: Google One -->
    <g transform="translate(25, 22)">
      <rect width="230" height="170" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="1" />
      <rect x="14" y="16" width="100" height="22" rx="5" fill="#ea4335" fill-opacity="0.2" />
      <text x="64" y="31" text-anchor="middle" fill="#f87171" font-family="system-ui, sans-serif" font-size="11" font-weight="700">GOOGLE ONE</text>
      <text x="14" y="66" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Free Tier: 15 GB</text>
      <text x="14" y="88" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">100 GB: &#x20B9;130 / mo</text>
      <text x="14" y="110" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">2 TB: &#x20B9;650 / mo</text>
      <text x="14" y="132" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12">Best: Photos &amp; Android</text>
      <text x="14" y="152" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Family: Up to 5 members</text>
    </g>

    <!-- Provider 2: Apple iCloud+ -->
    <g transform="translate(280, 22)">
      <rect width="230" height="170" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="1" />
      <rect x="14" y="16" width="95" height="22" rx="5" fill="#38bdf8" fill-opacity="0.2" />
      <text x="61" y="31" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">ICLOUD+</text>
      <text x="14" y="66" fill="#f87171" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Free Tier: 5 GB (Stingy!)</text>
      <text x="14" y="88" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">50 GB: &#x20B9;75 / mo</text>
      <text x="14" y="110" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">200 GB: &#x20B9;219 / mo</text>
      <text x="14" y="132" fill="#34d399" font-family="system-ui, sans-serif" font-size="12">Bonus: Private Relay</text>
      <text x="14" y="152" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Best: iPhone &amp; Mac sync</text>
    </g>

    <!-- Provider 3: Microsoft OneDrive -->
    <g transform="translate(535, 22)">
      <rect width="230" height="170" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#0284c7" stroke-width="1.5" />
      <rect x="14" y="16" width="115" height="22" rx="5" fill="#0284c7" fill-opacity="0.25" />
      <text x="71" y="31" text-anchor="middle" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="11" font-weight="700">MS ONEDRIVE</text>
      <text x="14" y="66" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Free Tier: 5 GB</text>
      <text x="14" y="88" fill="#34d399" font-family="system-ui, sans-serif" font-size="12 font-weight=600">1 TB + Office 365!</text>
      <text x="14" y="110" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">&#x20B9;489 / mo (M365 sub)</text>
      <text x="14" y="132" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12">Security: Personal Vault</text>
      <text x="14" y="152" fill="#34d399" font-family="system-ui, sans-serif" font-size="11 font-weight=bold">Best Value: Windows users</text>
    </g>

    <!-- Provider 4: Proton Drive -->
    <g transform="translate(790, 22)">
      <rect width="225" height="170" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#6366f1" stroke-width="1" />
      <rect x="14" y="16" width="115" height="22" rx="5" fill="#6366f1" fill-opacity="0.25" />
      <text x="71" y="31" text-anchor="middle" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">PROTON DRIVE</text>
      <text x="14" y="66" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Free Tier: 5 GB E2EE</text>
      <text x="14" y="88" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12">Zero-Knowledge Encrypted</text>
      <text x="14" y="110" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Swiss Privacy Law</text>
      <text x="14" y="132" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12">Zero AI Model Training</text>
      <text x="14" y="152" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Best: Maximum Privacy</text>
    </g>
  </g>

  <!-- Footer Branding -->
  <g transform="translate(80, 590)">
    <text fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">TrendsWheel Tech Comparisons &#x2022; Pricing in Indian Rupees (INR) and Global Privacy Breakdown</text>
  </g>
</svg>
