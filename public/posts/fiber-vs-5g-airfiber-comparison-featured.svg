<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="fiberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="airGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#10b981" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.06" stroke="#94a3b8" stroke-width="1">
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Header Badge -->
  <g transform="translate(80, 75)">
    <rect width="310" height="38" rx="19" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5" />
    <circle cx="22" cy="19" r="6" fill="#10b981" />
    <text x="40" y="24" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1">HOME INTERNET SHOWDOWN</text>
  </g>

  <!-- Title and Subtitle -->
  <g transform="translate(80, 165)">
    <text fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" line-height="1.2">
      <tspan x="0" y="0">Fiber Broadband vs 5G AirFiber:</tspan>
      <tspan x="0" y="58" fill="#38bdf8">Which Home Connection Is Better?</tspan>
    </text>
    <text x="0" y="125" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">
      Real Ping Latency (2ms vs 45ms), Monsoon Reliability, Tower Congestion &amp; FUP
    </text>
  </g>

  <!-- Comparison Split Card -->
  <g transform="translate(80, 345)" filter="url(#softGlow)">
    <rect width="1040" height="215" rx="18" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
    
    <!-- Left Box: Fiber (FTTH) -->
    <g transform="translate(30, 22)">
      <rect width="470" height="170" rx="14" fill="#1e293b" fill-opacity="0.5" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.8" />
      <rect x="20" y="18" width="180" height="26" rx="6" fill="#10b981" fill-opacity="0.2" />
      <text x="110" y="35" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">OPTICAL FIBER (FTTH)</text>
      
      <g transform="translate(20, 68)">
        <text x="0" y="0" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Ping / Latency:</text>
        <text x="190" y="0" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="700">2ms &#x2013; 8ms (Rock solid)</text>
        
        <text x="0" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Monsoon / Rain Impact:</text>
        <text x="190" y="32" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="700">0% (Light pulses in glass)</text>
        
        <text x="0" y="64" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Monthly FUP Limit:</text>
        <text x="190" y="64" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">3,300 GB (3.3 TB)</text>
      </g>
    </g>

    <!-- Right Box: 5G AirFiber (FWA) -->
    <g transform="translate(540, 22)">
      <rect width="470" height="170" rx="14" fill="#1e293b" fill-opacity="0.5" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.8" />
      <rect x="20" y="18" width="180" height="26" rx="6" fill="#8b5cf6" fill-opacity="0.2" />
      <text x="110" y="35" text-anchor="middle" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="12" font-weight="700">5G AIRFIBER (FWA)</text>
      
      <g transform="translate(20, 68)">
        <text x="0" y="0" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Ping / Latency:</text>
        <text x="190" y="0" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="14" font-weight="700">35ms &#x2013; 75ms (Jitter prone)</text>
        
        <text x="0" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Monsoon / Rain Impact:</text>
        <text x="190" y="32" fill="#f87171" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Rain attenuation possible</text>
        
        <text x="0" y="64" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Monthly FUP Limit:</text>
        <text x="190" y="64" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="14" font-weight="700">1,000 GB (1.0 TB)</text>
      </g>
    </g>
  </g>

  <!-- Footer Branding -->
  <g transform="translate(80, 590)">
    <text fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">TrendsWheel Tech Comparisons &#x2022; Tested on JioFiber, Jio AirFiber, Airtel Fiber and Airtel AirFiber</text>
  </g>
</svg>
