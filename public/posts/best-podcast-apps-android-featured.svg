<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d18" />
      <stop offset="50%" stop-color="#12182b" />
      <stop offset="100%" stop-color="#04060d" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#f59e0b" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Audio Waveform in background -->
  <g opacity="0.06" stroke="#f59e0b" stroke-width="3" stroke-linecap="round">
    <line x1="800" y1="200" x2="800" y2="280" />
    <line x1="820" y1="160" x2="820" y2="320" />
    <line x1="840" y1="120" x2="840" y2="360" />
    <line x1="860" y1="180" x2="860" y2="300" />
    <line x1="880" y1="140" x2="880" y2="340" />
    <line x1="900" y1="100" x2="900" y2="380" />
    <line x1="920" y1="160" x2="920" y2="320" />
    <line x1="940" y1="210" x2="940" y2="270" />
  </g>

  <!-- Header Badge -->
  <g transform="translate(80, 75)">
    <rect width="280" height="38" rx="19" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="22" cy="19" r="6" fill="#fbbf24" />
    <text x="40" y="24" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1">AUDIO &amp; MEDIA APPS</text>
  </g>

  <!-- Title and Subtitle -->
  <g transform="translate(80, 165)">
    <text fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" line-height="1.2">
      <tspan x="0" y="0">Best Podcast Apps for Android:</tspan>
      <tspan x="0" y="58" fill="#38bdf8">AntennaPod vs Pocket Casts vs Spotify</tspan>
    </text>
    <text x="0" y="125" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">
      Open RSS Freedom, Trim Silence Algorithms, Zero Injected Ads and OPML Portability
    </text>
  </g>

  <!-- 3 Player Comparison Card -->
  <g transform="translate(80, 345)" filter="url(#softGlow)">
    <rect width="1040" height="215" rx="18" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
    
    <!-- App 1: AntennaPod -->
    <g transform="translate(30, 22)">
      <rect width="305" height="170" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#10b981" stroke-width="1.5" />
      <rect x="18" y="18" width="135" height="24" rx="6" fill="#10b981" fill-opacity="0.2" />
      <text x="85" y="34" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">ANTENNAPOD (TOP PICK)</text>
      <text x="18" y="70" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="600">100% Free &amp; Open Source</text>
      <text x="18" y="94" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13">Ads: ZERO ads or monetization</text>
      <text x="18" y="118" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Account: No login required!</text>
      <text x="18" y="146" fill="#34d399" font-family="system-ui, sans-serif" font-size="12 font-weight=700">Best: Pure open RSS podcasting</text>
    </g>

    <!-- App 2: Pocket Casts -->
    <g transform="translate(365, 22)">
      <rect width="305" height="170" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#f87171" stroke-width="1" />
      <rect x="18" y="18" width="125" height="24" rx="6" fill="#ef4444" fill-opacity="0.2" />
      <text x="80" y="34" text-anchor="middle" fill="#f87171" font-family="system-ui, sans-serif" font-size="11" font-weight="700">POCKET CASTS</text>
      <text x="18" y="70" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Audio Engine Pioneer</text>
      <text x="18" y="94" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13">Features: Trim Silence &amp; Volume Boost</text>
      <text x="18" y="118" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Sync: Excellent cloud cross-platform</text>
      <text x="18" y="146" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Best for: Audiophile voice listening</text>
    </g>

    <!-- App 3: Spotify -->
    <g transform="translate(700, 22)">
      <rect width="310" height="170" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="1" />
      <rect x="18" y="18" width="130" height="24" rx="6" fill="#64748b" fill-opacity="0.2" />
      <text x="83" y="34" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">SPOTIFY PODCASTS</text>
      <text x="18" y="70" fill="#f87171" font-family="system-ui, sans-serif" font-size="14" font-weight="600">The Walled Garden Trap</text>
      <text x="18" y="94" fill="#f87171" font-family="system-ui, sans-serif" font-size="13">Ads: Injected even on Premium plans!</text>
      <text x="18" y="118" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Lock-in: Zero OPML export support</text>
      <text x="18" y="146" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="12">Verdict: Cluttered and proprietary</text>
    </g>
  </g>

  <!-- Footer Branding -->
  <g transform="translate(80, 590)">
    <text fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">TrendsWheel App Reviews &#x2022; Defending the Open RSS Podcast Ecosystem</text>
  </g>
</svg>
