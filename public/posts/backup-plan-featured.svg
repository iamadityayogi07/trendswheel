<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="A phone with three backup layers: device data, photos and chats">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1ec"/>
      <stop offset="0.6" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f6f9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1080" cy="80" r="170" fill="#e64a19" opacity="0.08"/>
  <circle cx="90" cy="600" r="150" fill="#e64a19" opacity="0.07"/>
  <text x="70" y="150" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#b83310" letter-spacing="3">ANDROID BACKUP PLAN</text>
  <text x="70" y="235" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" fill="#0f172a">Never lose your</text>
  <text x="70" y="310" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" fill="#0f172a">photos, chats</text>
  <text x="70" y="385" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" fill="#e64a19">and contacts</text>
  <text x="70" y="450" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#334155">A simple 3-layer plan you can set up in 20 minutes</text>
  <g transform="translate(70 500)">
    <rect width="170" height="52" rx="26" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="85" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Device data</text>
    <rect x="186" width="140" height="52" rx="26" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="256" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Photos</text>
    <rect x="342" width="170" height="52" rx="26" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="427" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a">WhatsApp</text>
  </g>
  <!-- phone -->
  <g transform="translate(790 70)">
    <rect x="0" y="0" width="290" height="490" rx="42" fill="#0f172a"/>
    <rect x="14" y="14" width="262" height="462" rx="30" fill="#ffffff"/>
    <rect x="105" y="26" width="80" height="12" rx="6" fill="#0f172a" opacity="0.85"/>
    <rect x="34" y="70" width="222" height="100" rx="18" fill="#fff1ec" stroke="#fdba9f"/>
    <circle cx="68" cy="120" r="22" fill="#e64a19"/>
    <path d="M58 121l7 7 13-15" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="104" y="114" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Layer 1</text>
    <text x="104" y="140" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#334155">Device data</text>
    <rect x="34" y="188" width="222" height="100" rx="18" fill="#fff1ec" stroke="#fdba9f"/>
    <circle cx="68" cy="238" r="22" fill="#e64a19"/>
    <path d="M58 239l7 7 13-15" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="104" y="232" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Layer 2</text>
    <text x="104" y="258" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#334155">Photos and videos</text>
    <rect x="34" y="306" width="222" height="100" rx="18" fill="#fff1ec" stroke="#fdba9f"/>
    <circle cx="68" cy="356" r="22" fill="#e64a19"/>
    <path d="M58 357l7 7 13-15" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="104" y="350" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Layer 3</text>
    <text x="104" y="376" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#334155">Chats and contacts</text>
    <text x="145" y="446" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#b83310">BACKUP COMPLETE</text>
  </g>
</svg>
