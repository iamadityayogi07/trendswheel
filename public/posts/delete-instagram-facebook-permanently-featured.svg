<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bg200" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a" />
      <stop offset="50%" stop-color="#2a0808" />
      <stop offset="100%" stop-color="#140202" />
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow200" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg200)" />
  <circle cx="220" cy="180" r="160" fill="#ef4444" opacity="0.12" filter="url(#glow200)" />
  <circle cx="1000" cy="450" r="200" fill="#dc2626" opacity="0.1" filter="url(#glow200)" />
  <rect x="140" y="70" width="160" height="34" rx="17" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1.5" />
  <text x="220" y="93" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">DIGITAL DETOX</text>
  <text x="140" y="165" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" line-height="1.2">
    <tspan x="140" dy="0">Permanently Delete Instagram</tspan>
    <tspan x="140" dy="56" fill="url(#redGlow)">&amp; Facebook Accounts (2026)</tspan>
  </text>
  <text x="140" y="275" fill="#fecaca" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
    <tspan x="140" dy="0">Deactivation vs. permanent erasure. How to navigate Meta Accounts Center,</tspan>
    <tspan x="140" dy="30">bypass the 30-day retention trap, and export your lifetime photo archives.</tspan>
  </text>
  <g transform="translate(140, 360)">
    <rect width="280" height="180" rx="16" fill="#1c0505" fill-opacity="0.8" stroke="#7f1d1d" stroke-width="1.5" />
    <circle cx="48" cy="48" r="24" fill="#3b82f6" fill-opacity="0.2" />
    <path d="M48 38 v14 M42 46 l6 6 6 -6" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="86" y="44" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">1. Export Archives</text>
    <text x="86" y="64" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Download photos &amp; posts</text>
    <text x="24" y="105" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">&#x2022; Request JSON / HTML backup</text>
    <text x="24" y="130" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">&#x2022; Wait 24-48 hrs for zip file</text>
    <text x="24" y="155" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">&#x2022; Save offline before delete</text>
  </g>
  <g transform="translate(460, 360)">
    <rect width="280" height="180" rx="16" fill="#1c0505" fill-opacity="0.8" stroke="#7f1d1d" stroke-width="1.5" />
    <circle cx="48" cy="48" r="24" fill="#ef4444" fill-opacity="0.2" />
    <path d="M40 40 l16 16 M56 40 l-16 16" stroke="#f87171" stroke-width="2.5" stroke-linecap="round" />
    <text x="86" y="44" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">2. Accounts Center</text>
    <text x="86" y="64" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Personal Details menu</text>
    <text x="24" y="105" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">&#x2022; Choose 'Account Ownership'</text>
    <text x="24" y="130" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">&#x2022; Select 'Delete Account'</text>
    <text x="24" y="155" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">&#x2022; Confirm account password</text>
  </g>
  <g transform="translate(780, 360)">
    <rect width="280" height="180" rx="16" fill="#1c0505" fill-opacity="0.8" stroke="#7f1d1d" stroke-width="1.5" />
    <circle cx="48" cy="48" r="24" fill="#f59e0b" fill-opacity="0.2" />
    <path d="M48 38 v10 M48 54 v2" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
    <text x="86" y="44" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">3. 30-Day Cooldown</text>
    <text x="86" y="64" fill="#fde68a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Do NOT log back in</text>
    <text x="24" y="105" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">&#x2022; Any login cancels deletion</text>
    <text x="24" y="130" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">&#x2022; Unlink third-party SSO apps</text>
    <text x="24" y="155" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">&#x2022; Total purge takes 90 days</text>
  </g>
</svg>