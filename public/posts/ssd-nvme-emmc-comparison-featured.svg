<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e18" />
      <stop offset="50%" stop-color="#0f192b" />
      <stop offset="100%" stop-color="#03070f" />
    </linearGradient>
    <linearGradient id="speedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#10b981" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Speedometer abstract bar in background -->
  <g opacity="0.06" stroke="#10b981" stroke-width="2">
    <line x1="80" y1="520" x2="1120" y2="520" />
    <circle cx="1050" cy="520" r="14" fill="#10b981" />
  </g>

  <!-- Header Badge -->
  <g transform="translate(80, 75)">
    <rect width="280" height="38" rx="19" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5" />
    <circle cx="22" cy="19" r="6" fill="#10b981" />
    <text x="40" y="24" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1">STORAGE HARDWARE GUIDE</text>
  </g>

  <!-- Title and Subtitle -->
  <g transform="translate(80, 165)">
    <text fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" line-height="1.2">
      <tspan x="0" y="0">SSD vs NVMe vs eMMC Storage:</tspan>
      <tspan x="0" y="58" fill="#38bdf8">What Do You Actually Need?</tspan>
    </text>
    <text x="0" y="125" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">
      Read/Write Speeds (150 MB/s vs 7000 MB/s), Half-Duplex Traps and Real Laptop Boot Times
    </text>
  </g>

  <!-- 3 Storage Standards Card -->
  <g transform="translate(80, 345)" filter="url(#softGlow)">
    <rect width="1040" height="215" rx="18" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
    
    <!-- Box 1: eMMC -->
    <g transform="translate(30, 22)">
      <rect width="305" height="170" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#ef4444" stroke-width="1" />
      <rect x="18" y="18" width="130" height="24" rx="6" fill="#ef4444" fill-opacity="0.2" />
      <text x="83" y="34" text-anchor="middle" fill="#f87171" font-family="system-ui, sans-serif" font-size="11" font-weight="700">eMMC 5.1 (BUDGET TRAP)</text>
      <text x="18" y="70" fill="#f87171" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Speed: ~150&#x2013;300 MB/s</text>
      <text x="18" y="94" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Interface: Half-Duplex (Read OR write)</text>
      <text x="18" y="118" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Mount: Soldered BGA chip</text>
      <text x="18" y="146" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="12">Warning: Avoid on Windows laptops</text>
    </g>

    <!-- Box 2: SATA SSD -->
    <g transform="translate(365, 22)">
      <rect width="305" height="170" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#f59e0b" stroke-width="1" />
      <rect x="18" y="18" width="115" height="24" rx="6" fill="#f59e0b" fill-opacity="0.2" />
      <text x="75" y="34" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="700">SATA 3 SSD (2.5&quot;)</text>
      <text x="18" y="70" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Speed: ~500&#x2013;550 MB/s</text>
      <text x="18" y="94" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Interface: Full-Duplex (Read &amp; write)</text>
      <text x="18" y="118" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Bus: Legacy AHCI / 6 Gbps bus</text>
      <text x="18" y="146" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Best for: Reviving old 2015&#x2013;2020 PCs</text>
    </g>

    <!-- Box 3: M.2 NVMe PCIe -->
    <g transform="translate(700, 22)">
      <rect width="310" height="170" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#10b981" stroke-width="1.5" />
      <rect x="18" y="18" width="140" height="24" rx="6" fill="#10b981" fill-opacity="0.2" />
      <text x="88" y="34" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">M.2 NVMe (GEN 4 / 5)</text>
      <text x="18" y="70" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Speed: 3,500 &#x2013; 7,400+ MB/s</text>
      <text x="18" y="94" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Interface: Direct PCIe lanes to CPU</text>
      <text x="18" y="118" fill="#34d399" font-family="system-ui, sans-serif" font-size="13">Queue Depth: 64,000 queues</text>
      <text x="18" y="146" fill="#34d399" font-family="system-ui, sans-serif" font-size="12 font-weight=700">Gold Standard: Modern laptops &amp; PCs</text>
    </g>
  </g>

  <!-- Footer Branding -->
  <g transform="translate(80, 590)">
    <text fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">TrendsWheel Hardware Guide &#x2022; Real-World Benchmark Audits and Buying Recommendations</text>
  </g>
</svg>
