<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bg201" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#021c16" />
    </linearGradient>
    <linearGradient id="detectGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow201" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg201)" />
  <circle cx="220" cy="180" r="160" fill="#10b981" opacity="0.12" filter="url(#glow201)" />
  <circle cx="1000" cy="450" r="190" fill="#38bdf8" opacity="0.1" filter="url(#glow201)" />
  <rect x="140" y="70" width="165" height="34" rx="17" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5" />
  <text x="222" y="93" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">DEVICE AUDIT</text>
  <text x="140" y="165" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" line-height="1.2">
    <tspan x="140" dy="0">Detect If Someone Is Spying on</tspan>
    <tspan x="140" dy="56" fill="url(#detectGlow)">Your WhatsApp via Linked Devices</tspan>
  </text>
  <text x="140" y="275" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
    <tspan x="140" dy="0">A brief unlocked phone is all it takes to link WhatsApp Web.</tspan>
    <tspan x="140" dy="30">How to audit active sessions, recognize ghost syncs, and lock biometric scans.</tspan>
  </text>
  <g transform="translate(140, 360)">
    <rect width="280" height="180" rx="16" fill="#042f2e" fill-opacity="0.8" stroke="#0d9488" stroke-width="1.5" />
    <circle cx="48" cy="48" r="24" fill="#06b6d4" fill-opacity="0.2" />
    <path d="M40 44 h16 v12 h-16 z M44 56 v4 h8 v-4" stroke="#22d3ee" stroke-width="2" fill="none" />
    <text x="86" y="44" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Audit Linked Devices</text>
    <text x="86" y="64" fill="#67e8f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Settings &gt; Linked Devices</text>
    <text x="24" y="105" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">&#x2022; Shows OS, browser &amp; last active</text>
    <text x="24" y="130" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">&#x2022; One-tap 'Log Out' of all sessions</text>
    <text x="24" y="155" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">&#x2022; Instantly revokes session tokens</text>
  </g>
  <g transform="translate(460, 360)">
    <rect width="280" height="180" rx="16" fill="#042f2e" fill-opacity="0.8" stroke="#0d9488" stroke-width="1.5" />
    <circle cx="48" cy="48" r="24" fill="#ef4444" fill-opacity="0.2" />
    <path d="M48 38 v10 M48 54 v2" stroke="#f87171" stroke-width="2.5" stroke-linecap="round" />
    <text x="86" y="44" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Subtle Warning Signs</text>
    <text x="86" y="64" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Ghost activity indicators</text>
    <text x="24" y="105" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">&#x2022; Messages read before you open them</text>
    <text x="24" y="130" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">&#x2022; 'WhatsApp Web is active' alerts</text>
    <text x="24" y="155" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">&#x2022; Abnormal battery discharge</text>
  </g>
  <g transform="translate(780, 360)">
    <rect width="280" height="180" rx="16" fill="#042f2e" fill-opacity="0.8" stroke="#0d9488" stroke-width="1.5" />
    <circle cx="48" cy="48" r="24" fill="#10b981" fill-opacity="0.2" />
    <path d="M48 36 l14 7 v8 c0 9 -6 17 -14 21 c-8 -4 -14 -12 -14 -21 v-8 z" stroke="#34d399" stroke-width="2" fill="none" />
    <text x="86" y="44" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Biometric Pairing Lock</text>
    <text x="86" y="64" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Prevent unauthorized QR scans</text>
    <text x="24" y="105" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">&#x2022; Requires fingerprint to link device</text>
    <text x="24" y="130" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">&#x2022; Enable app lock in Privacy settings</text>
    <text x="24" y="155" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">&#x2022; 100% immune to casual snooping</text>
  </g>
</svg>