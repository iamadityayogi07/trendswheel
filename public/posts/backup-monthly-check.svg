<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-label="Monthly two-minute backup check: Google backup status, Photos status, WhatsApp last backup, free storage">
  <rect width="900" height="460" rx="24" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="62" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#0f172a">Your 2-minute monthly backup check</text>
  <rect x="40" y="78" width="72" height="4" rx="2" fill="#e64a19"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(40 112)">
      <rect width="820" height="70" rx="16" fill="#fff1ec" stroke="#fdba9f"/>
      <rect x="20" y="20" width="30" height="30" rx="8" fill="#ffffff" stroke="#e64a19" stroke-width="3"/>
      <path d="M27 36l6 6 11-13" fill="none" stroke="#e64a19" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="72" y="36" font-size="22" font-weight="700" fill="#0f172a">Google backup is on</text>
      <text x="72" y="58" font-size="16" fill="#334155">Settings, Google services, Backup: check Backup details</text>
    </g>
    <g transform="translate(40 196)">
      <rect width="820" height="70" rx="16" fill="#fff1ec" stroke="#fdba9f"/>
      <rect x="20" y="20" width="30" height="30" rx="8" fill="#ffffff" stroke="#e64a19" stroke-width="3"/>
      <path d="M27 36l6 6 11-13" fill="none" stroke="#e64a19" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="72" y="36" font-size="22" font-weight="700" fill="#0f172a">Google Photos says "Backup complete"</text>
      <text x="72" y="58" font-size="16" fill="#334155">Tap your profile picture in Google Photos and read the status</text>
    </g>
    <g transform="translate(40 280)">
      <rect width="820" height="70" rx="16" fill="#fff1ec" stroke="#fdba9f"/>
      <rect x="20" y="20" width="30" height="30" rx="8" fill="#ffffff" stroke="#e64a19" stroke-width="3"/>
      <path d="M27 36l6 6 11-13" fill="none" stroke="#e64a19" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="72" y="36" font-size="22" font-weight="700" fill="#0f172a">WhatsApp shows a recent backup time</text>
      <text x="72" y="58" font-size="16" fill="#334155">Settings, Chats, Chat backup: look at "Last Backup"</text>
    </g>
    <g transform="translate(40 364)">
      <rect width="820" height="70" rx="16" fill="#fff1ec" stroke="#fdba9f"/>
      <rect x="20" y="20" width="30" height="30" rx="8" fill="#ffffff" stroke="#e64a19" stroke-width="3"/>
      <path d="M27 36l6 6 11-13" fill="none" stroke="#e64a19" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="72" y="36" font-size="22" font-weight="700" fill="#0f172a">Google account storage is not full</text>
      <text x="72" y="58" font-size="16" fill="#334155">Google Photos and Drive share the same free space</text>
    </g>
  </g>
</svg>
