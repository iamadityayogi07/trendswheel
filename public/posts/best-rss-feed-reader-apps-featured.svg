    <tspan x="140" dy="56" fill="url(#titleGlow)">FreshRSS, Miniflux &amp; Feeder</tspan>
  </text>
  <text x="140" y="275" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
    <tspan x="140" dy="0">Escaping algorithmic manipulation, full-text readability scraping, Fever API sync,</tspan>
    <tspan x="140" dy="30">offline caching, OPML import/export, and distraction-free mobile journalism.</tspan>
  </text>
