<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1017" />
      <stop offset="50%" stop-color="#141f2e" />
      <stop offset="100%" stop-color="#05080e" />
    </linearGradient>
    <linearGradient id="heatGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#f59e0b" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Abstract Voltage Pulses -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1.5" fill="none">
    <path d="M 100 200 L 300 200 L 330 140 L 360 260 L 390 200 L 700 200" />
    <path d="M 500 450 L 700 450 L 730 390 L 760 510 L 790 450 L 1100 450" />
  </g>

  <!-- Header Badge -->
  <g transform="translate(80, 75)">
    <rect width="290" height="38" rx="19" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="22" cy="19" r="6" fill="#f59e0b" />
    <text x="40" y="24" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1">BATTERY SCIENCE EXPLAINER</text>
  </g>

  <!-- Title and Subtitle -->
  <g transform="translate(80, 165)">
    <text fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" line-height="1.2">
      <tspan x="0" y="0">Does Fast Charging Ruin Your Battery?</tspan>
      <tspan x="0" y="58" fill="#38bdf8">The Real Science, Heat &amp; 80% Myth</tspan>
    </text>
    <text x="0" y="125" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">
      33W vs 67W vs 120W Tests, Dual-Cell Architecture and Lithium Degradation
    </text>
  </g>

  <!-- 3 Scientific Truths Matrix Card -->
  <g transform="translate(80, 345)" filter="url(#softGlow)">
    <rect width="1040" height="215" rx="18" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
    
    <!-- Box 1 -->
    <g transform="translate(30, 22)">
      <rect width="305" height="170" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#ef4444" stroke-width="1" />
      <rect x="18" y="18" width="100" height="24" rx="6" fill="#ef4444" fill-opacity="0.2" />
      <text x="68" y="34" text-anchor="middle" fill="#f87171" font-family="system-ui, sans-serif" font-size="11" font-weight="700">THE REAL ENEMY</text>
      <text x="18" y="72" fill="#f87171" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Thermal Heat (&gt;38&#xB0;C)</text>
      <text x="18" y="96" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">High wattage is not toxic.</text>
      <text x="18" y="118" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Heat during charging breaks</text>
      <text x="18" y="140" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="12">down lithium electrolyte layers.</text>
    </g>

    <!-- Box 2 -->
    <g transform="translate(365, 22)">
      <rect width="305" height="170" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#10b981" stroke-width="1.5" />
      <rect x="18" y="18" width="115" height="24" rx="6" fill="#10b981" fill-opacity="0.2" />
      <text x="75" y="34" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">MODERN FIX</text>
      <text x="18" y="72" fill="#34d399" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Dual-Cell Battery</text>
      <text x="18" y="96" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">A 120W phone charges two</text>
      <text x="18" y="118" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">separate 2,500mAh cells at</text>
      <text x="18" y="140" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12 font-weight=600">60W each, keeping heat low.</text>
    </g>

    <!-- Box 3 -->
    <g transform="translate(700, 22)">
      <rect width="310" height="170" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#38bdf8" stroke-width="1" />
      <rect x="18" y="18" width="120" height="24" rx="6" fill="#0284c7" fill-opacity="0.2" />
      <text x="78" y="34" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">THE 80% LIMIT</text>
      <text x="18" y="72" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15" font-weight="700">High-Voltage Strain</text>
      <text x="18" y="96" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Staying at 100% all night</text>
      <text x="18" y="118" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">strains cathode structure.</text>
      <text x="18" y="140" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12">80% cap extends life by ~1.5 yrs.</text>
    </g>
  </g>

  <!-- Footer Branding -->
  <g transform="translate(80, 590)">
    <text fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">TrendsWheel Tech Deep Dive &#x2022; Lithium-Ion Chemistry and Thermal Management Facts</text>
  </g>
</svg>
