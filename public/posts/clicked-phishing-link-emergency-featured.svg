<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Emergency checklist: What to do immediately if you clicked a suspicious link on Android">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1ec"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1120" cy="70" r="180" fill="#e64a19" opacity="0.08"/>
  <circle cx="80" cy="620" r="160" fill="#e64a19" opacity="0.06"/>
  
  <!-- Left Header -->
  <text x="70" y="140" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#b83310" letter-spacing="3">EMERGENCY PHONE SECURITY</text>
  <text x="70" y="225" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="800" fill="#0f172a">Clicked a Suspicious</text>
  <text x="70" y="295" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="800" fill="#0f172a">Link on Android?</text>
  <text x="70" y="365" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="800" fill="#e64a19">What to Do Right Now</text>
  <text x="70" y="425" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#475569">Airplane mode, APK payload cleanup &amp; device admin inspection</text>
  
  <!-- Badges -->
  <g transform="translate(70 475)">
    <rect width="175" height="46" rx="23" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="87" y="29" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Airplane Mode</text>
    <rect x="190" width="175" height="46" rx="23" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="277" y="29" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Check Downloads</text>
    <rect x="380" width="175" height="46" rx="23" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="467" y="29" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Device Admin Apps</text>
  </g>
  
  <!-- Alert Banner -->
  <g transform="translate(70 545)">
    <rect width="530" height="44" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="20" y="28" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#b91c1c">&#x26A0; Do not panic: clicking alone rarely installs malware without tapping Install</text>
  </g>
  
  <!-- Right Column Checklist Card -->
  <g transform="translate(680 75)" filter="url(#shadow)">
    <rect width="460" height="480" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect width="460" height="60" rx="24" fill="#0f172a"/>
    <rect y="35" width="460" height="25" fill="#0f172a"/>
    <text x="25" y="38" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#ffffff">10-MINUTE TRIAGE CHECKLIST</text>
    <circle cx="425" cy="35" r="8" fill="#ef4444"/>
    
    <!-- Step 1 -->
    <g transform="translate(25 85)">
      <circle cx="20" cy="20" r="16" fill="#fee2e2"/>
      <text x="20" y="26" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#b91c1c">1</text>
      <text x="48" y="18" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Turn On Airplane Mode (Cut Wi-Fi &amp; Data)</text>
      <text x="48" y="38" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">Stops background data exfiltration immediately</text>
    </g>
    
    <!-- Step 2 -->
    <g transform="translate(25 160)">
      <circle cx="20" cy="20" r="16" fill="#fee2e2"/>
      <text x="20" y="26" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#b91c1c">2</text>
      <text x="48" y="18" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Open Files &gt; Check &quot;Download&quot; Folder</text>
      <text x="48" y="38" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">Delete any recent .apk or unknown download</text>
    </g>
    
    <!-- Step 3 -->
    <g transform="translate(25 235)">
      <circle cx="20" cy="20" r="16" fill="#fee2e2"/>
      <text x="20" y="26" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#b91c1c">3</text>
      <text x="48" y="18" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Inspect &quot;Device Admin Apps&quot; in Settings</text>
      <text x="48" y="38" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">Revoke admin rights for any unrecognized app</text>
    </g>
    
    <!-- Step 4 -->
    <g transform="translate(25 310)">
      <circle cx="20" cy="20" r="16" fill="#fee2e2"/>
      <text x="20" y="26" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#b91c1c">4</text>
      <text x="48" y="18" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Clear Browser History, Cache &amp; Cookies</text>
      <text x="48" y="38" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">Purges malicious redirect scripts and session tokens</text>
    </g>
    
    <!-- Step 5 -->
    <g transform="translate(25 385)">
      <circle cx="20" cy="20" r="16" fill="#dcfce7"/>
      <text x="20" y="26" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#15803d">&#x2713;</text>
      <text x="48" y="18" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Run Full Google Play Protect Scan</text>
      <text x="48" y="38" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">Verifies device integrity across all installed apps</text>
    </g>
  </g>
</svg>