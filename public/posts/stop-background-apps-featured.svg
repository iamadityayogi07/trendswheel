<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d" />
      <stop offset="50%" stop-color="#141d2f" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="batteryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#10b981" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Waves -->
  <g opacity="0.06" stroke="#38bdf8" stroke-width="1.5" fill="none">
    <path d="M 0 200 C 300 280 600 120 1200 240" />
    <path d="M 0 350 C 400 450 800 280 1200 380" />
    <path d="M 0 500 C 500 580 900 420 1200 520" />
  </g>

  <!-- Header Badge -->
  <g transform="translate(80, 75)">
    <rect width="270" height="38" rx="19" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5" />
    <circle cx="22" cy="19" r="6" fill="#10b981" />
    <text x="40" y="24" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1">ANDROID BATTERY OPTIMIZATION</text>
  </g>

  <!-- Title and Subtitle -->
  <g transform="translate(80, 165)">
    <text fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" line-height="1.2">
      <tspan x="0" y="0">Stop Android Apps Running in Background</tspan>
      <tspan x="0" y="58" fill="#34d399">&amp; Draining Your Battery Overnight</tspan>
    </text>
    <text x="0" y="125" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">
      App Standby Buckets, Restricted Mode, Deep Sleep &amp; Background Data Throttling
    </text>
  </g>

  <!-- Visual Dashboard Card -->
  <g transform="translate(80, 345)" filter="url(#softGlow)">
    <rect width="1040" height="215" rx="18" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
    
    <!-- 3 Actionable Pillars -->
    <!-- Pillar 1 -->
    <g transform="translate(30, 25)">
      <rect width="305" height="165" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
      <circle cx="36" cy="36" r="16" fill="#ef4444" fill-opacity="0.2" />
      <text x="36" y="42" text-anchor="middle" fill="#f87171" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">OFF</text>
      <text x="66" y="34" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Stop Force-Closing</text>
      <text x="66" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Swipe-away myth debunked</text>
      <text x="25" y="90" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" line-height="1.4">
        <tspan x="25" y="90">Swiping apps out of memory</tspan>
        <tspan x="25" y="112">forces heavy cold restarts.</tspan>
        <tspan x="25" y="134" fill="#fca5a5">Consumes 2x CPU cycles.</tspan>
      </text>
    </g>

    <!-- Pillar 2 -->
    <g transform="translate(365, 25)">
      <rect width="305" height="165" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
      <circle cx="36" cy="36" r="16" fill="#10b981" fill-opacity="0.2" />
      <text x="36" y="42" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">SET</text>
      <text x="66" y="34" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Battery: &quot;Restricted&quot;</text>
      <text x="66" y="52" fill="#34d399" font-family="system-ui, sans-serif" font-size="11">Per-app optimization rule</text>
      <text x="25" y="90" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" line-height="1.4">
        <tspan x="25" y="90">Put social &amp; shopping apps</tspan>
        <tspan x="25" y="112">into Restricted mode. Stops</tspan>
        <tspan x="25" y="134" fill="#6ee7b7">wakelocks when screen is off.</tspan>
      </text>
    </g>

    <!-- Pillar 3 -->
    <g transform="translate(700, 25)">
      <rect width="310" height="165" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
      <circle cx="36" cy="36" r="16" fill="#38bdf8" fill-opacity="0.2" />
      <text x="36" y="42" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">NET</text>
      <text x="66" y="34" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Cut Background Data</text>
      <text x="66" y="52" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">Cellular &amp; Wi-Fi limits</text>
      <text x="25" y="90" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" line-height="1.4">
        <tspan x="25" y="90">Toggle off &apos;Background data&apos;.</tspan>
        <tspan x="25" y="112">Stops stealth ad pings &amp;</tspan>
        <tspan x="25" y="134" fill="#7dd3fc">saves 15%&#x2013;20% daily juice.</tspan>
      </text>
    </g>
  </g>

  <!-- Footer Branding -->
  <g transform="translate(80, 590)">
    <text fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">TrendsWheel Device Guides • Works on Samsung One UI, Xiaomi HyperOS, Pixel &amp; OxygenOS</text>
  </g>
</svg>
