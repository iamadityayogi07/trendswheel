<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#111c38" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#06b6d4" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Radio wave circles in background -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1.5" fill="none">
    <circle cx="1050" cy="180" r="80" />
    <circle cx="1050" cy="180" r="160" />
    <circle cx="1050" cy="180" r="240" />
    <circle cx="1050" cy="180" r="320" />
  </g>

  <!-- Header Badge -->
  <g transform="translate(80, 75)">
    <rect width="280" height="38" rx="19" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-width="1.5" />
    <circle cx="22" cy="19" r="6" fill="#38bdf8" />
    <text x="40" y="24" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1">HOME NETWORKING GUIDE</text>
  </g>

  <!-- Title and Subtitle -->
  <g transform="translate(80, 165)">
    <text fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" line-height="1.2">
      <tspan x="0" y="0">Wi-Fi 5 vs Wi-Fi 6 vs Wi-Fi 7:</tspan>
      <tspan x="0" y="58" fill="#38bdf8">Is Upgrading Your Router Worth It?</tspan>
    </text>
    <text x="0" y="125" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">
      Bandwidth, Latency (OFDMA), 6 GHz Channels and Real 100&#x2013;300 Mbps Testing
    </text>
  </g>

  <!-- 3 Generation Comparison Card -->
  <g transform="translate(80, 345)" filter="url(#softGlow)">
    <rect width="1040" height="215" rx="18" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
    
    <!-- Box 1: Wi-Fi 5 -->
    <g transform="translate(30, 22)">
      <rect width="305" height="170" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="1" />
      <rect x="18" y="18" width="90" height="24" rx="6" fill="#64748b" fill-opacity="0.2" />
      <text x="63" y="34" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">WI-FI 5 (802.11ac)</text>
      <text x="18" y="72" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Max Practical: ~450 Mbps</text>
      <text x="18" y="96" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Bands: 2.4 GHz + 5 GHz</text>
      <text x="18" y="120" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Congestion: Buffers with 15+ devices</text>
      <text x="18" y="148" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Best for: Budget 50&#x2013;100 Mbps plans</text>
    </g>

    <!-- Box 2: Wi-Fi 6 -->
    <g transform="translate(365, 22)">
      <rect width="305" height="170" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#0284c7" stroke-width="1.5" />
      <rect x="18" y="18" width="90" height="24" rx="6" fill="#0284c7" fill-opacity="0.25" />
      <text x="63" y="34" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">WI-FI 6 (802.11ax)</text>
      <text x="18" y="72" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Max Practical: ~900 Mbps</text>
      <text x="18" y="96" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Tech: OFDMA + Target Wake Time</text>
      <text x="18" y="120" fill="#34d399" font-family="system-ui, sans-serif" font-size="13">Handles 40+ smart home devices</text>
      <text x="18" y="148" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Sweet Spot: Best value for 90% homes</text>
    </g>

    <!-- Box 3: Wi-Fi 7 -->
    <g transform="translate(700, 22)">
      <rect width="310" height="170" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#6366f1" stroke-width="1" />
      <rect x="18" y="18" width="90" height="24" rx="6" fill="#6366f1" fill-opacity="0.2" />
      <text x="63" y="34" text-anchor="middle" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">WI-FI 7 (802.11be)</text>
      <text x="18" y="72" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Max Practical: 5+ Gbps</text>
      <text x="18" y="96" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Tech: 320 MHz + Multi-Link (MLO)</text>
      <text x="18" y="120" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Near-zero latency VR/NAS streaming</text>
      <text x="18" y="148" fill="#fb7185" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Status: Expensive overkill for most</text>
    </g>
  </g>

  <!-- Footer Branding -->
  <g transform="translate(80, 590)">
    <text fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">TrendsWheel Tech Explainer &#x2022; Real-World Home Bandwidth and Latency Benchmarks</text>
  </g>
</svg>
