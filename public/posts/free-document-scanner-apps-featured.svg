<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090f1d" />
      <stop offset="50%" stop-color="#121b2d" />
      <stop offset="100%" stop-color="#04070e" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#38bdf8" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Document outline in background -->
  <g opacity="0.06" stroke="#38bdf8" stroke-width="2" fill="none">
    <rect x="850" y="80" width="260" height="360" rx="12" />
    <line x1="880" y1="140" x2="1050" y2="140" />
    <line x1="880" y1="180" x2="1080" y2="180" />
    <line x1="880" y1="220" x2="1020" y2="220" />
    <line x1="880" y1="260" x2="1060" y2="260" />
  </g>

  <!-- Header Badge -->
  <g transform="translate(80, 75)">
    <rect width="280" height="38" rx="19" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-width="1.5" />
    <circle cx="22" cy="19" r="6" fill="#38bdf8" />
    <text x="40" y="24" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1">DOCUMENT SCANNER GUIDE</text>
  </g>

  <!-- Title and Subtitle -->
  <g transform="translate(80, 165)">
    <text fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" line-height="1.2">
      <tspan x="0" y="0">Best Free Document Scanners:</tspan>
      <tspan x="0" y="58" fill="#38bdf8">Zero Watermarks, Ads or Fees</tspan>
    </text>
    <text x="0" y="125" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">
      Microsoft Lens, OpenScan, Native Google Drive and Ditching CamScanner Traps
    </text>
  </g>

  <!-- 3 Scanner Matrix Card -->
  <g transform="translate(80, 345)" filter="url(#softGlow)">
    <rect width="1040" height="215" rx="18" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
    
    <!-- App 1: Microsoft Lens -->
    <g transform="translate(30, 22)">
      <rect width="305" height="170" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#0284c7" stroke-width="1.5" />
      <rect x="18" y="18" width="125" height="24" rx="6" fill="#0284c7" fill-opacity="0.25" />
      <text x="80" y="34" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">MICROSOFT LENS</text>
      <text x="18" y="70" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="600">100% Free &amp; Clean PDF</text>
      <text x="18" y="94" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13">Watermarks: Absolutely ZERO</text>
      <text x="18" y="118" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">OCR: Free text &amp; table extraction</text>
      <text x="18" y="146" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12 font-weight=700">Best for: Office docs, IDs &amp; contracts</text>
    </g>

    <!-- App 2: Google Drive Native -->
    <g transform="translate(365, 22)">
      <rect width="305" height="170" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#10b981" stroke-width="1" />
      <rect x="18" y="18" width="135" height="24" rx="6" fill="#10b981" fill-opacity="0.2" />
      <text x="85" y="34" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">GOOGLE DRIVE SCAN</text>
      <text x="18" y="70" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Built Right Into Android</text>
      <text x="18" y="94" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13">Install: Already on your phone!</text>
      <text x="18" y="118" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Auto-Crop: Instant edge detection</text>
      <text x="18" y="146" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Best for: Quick 1-tap receipts &amp; bills</text>
    </g>

    <!-- App 3: CamScanner Warning -->
    <g transform="translate(700, 22)">
      <rect width="310" height="170" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#ef4444" stroke-width="1" />
      <rect x="18" y="18" width="130" height="24" rx="6" fill="#ef4444" fill-opacity="0.2" />
      <text x="83" y="34" text-anchor="middle" fill="#f87171" font-family="system-ui, sans-serif" font-size="11" font-weight="700">CAMSCANNER (AVOID)</text>
      <text x="18" y="70" fill="#f87171" font-family="system-ui, sans-serif" font-size="14" font-weight="600">The Subscription Trap</text>
      <text x="18" y="94" fill="#f87171" font-family="system-ui, sans-serif" font-size="13">Watermarks: &quot;Scanned with CS&quot;</text>
      <text x="18" y="118" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Cost: Demands &#x20B9;800/mo paywall</text>
      <text x="18" y="146" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="12">Verdict: Bloated adware to uninstall</text>
    </g>
  </g>

  <!-- Footer Branding -->
  <g transform="translate(80, 590)">
    <text fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">TrendsWheel App Guide &#x2022; Free Document Digitization Without Subscriptions</text>
  </g>
</svg>
