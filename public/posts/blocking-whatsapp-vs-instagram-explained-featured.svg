<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bg199" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="splitGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#25d366" />
      <stop offset="50%" stop-color="#e1306c" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow199" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg199)" />
  <circle cx="240" cy="180" r="150" fill="#25d366" opacity="0.1" filter="url(#glow199)" />
  <circle cx="980" cy="450" r="180" fill="#e1306c" opacity="0.1" filter="url(#glow199)" />
  <rect x="140" y="70" width="170" height="34" rx="17" fill="#e1306c" fill-opacity="0.2" stroke="#e1306c" stroke-width="1.5" />
  <text x="225" y="93" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">PLATFORM BEHAVIOR</text>
  <text x="140" y="165" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" line-height="1.2">
    <tspan x="140" dy="0">What Actually Happens When You</tspan>
    <tspan x="140" dy="56" fill="url(#splitGlow)">Block on WhatsApp vs Instagram?</tspan>
  </text>
  <text x="140" y="275" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
    <tspan x="140" dy="0">Do they get notified? What happens to existing DMs, shared groups,</tspan>
    <tspan x="140" dy="30">profile pictures, and future accounts created by the blocked person?</tspan>
  </text>
  <g transform="translate(140, 360)">
    <rect width="440" height="180" rx="16" fill="#18181b" fill-opacity="0.8" stroke="#25d366" stroke-width="1.5" />
    <circle cx="48" cy="48" r="24" fill="#25d366" fill-opacity="0.2" />
    <text x="48" y="55" fill="#25d366" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" text-anchor="middle">W</text>
    <text x="86" y="44" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">WhatsApp Blocking Rules</text>
    <text x="86" y="64" fill="#86efac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Silent isolation protocol</text>
    <text x="24" y="105" fill="#d4d4d8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">&#x2022; Messages stay stuck on single grey tick</text>
    <text x="24" y="130" fill="#d4d4d8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">&#x2022; Profile picture &amp; status vanish</text>
    <text x="24" y="155" fill="#d4d4d8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">&#x2022; Shared groups STILL allow both to talk</text>
  </g>
  <g transform="translate(620, 360)">
    <rect width="440" height="180" rx="16" fill="#18181b" fill-opacity="0.8" stroke="#e1306c" stroke-width="1.5" />
    <circle cx="48" cy="48" r="24" fill="#e1306c" fill-opacity="0.2" />
    <text x="48" y="55" fill="#e1306c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" text-anchor="middle">I</text>
    <text x="86" y="44" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">Instagram Blocking Rules</text>
    <text x="86" y="64" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Device-level identity suppression</text>
    <text x="24" y="105" fill="#d4d4d8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">&#x2022; Blocks profile &amp; other accounts they create</text>
    <text x="24" y="130" fill="#d4d4d8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">&#x2022; Prior comments remain visible (must delete)</text>
    <text x="24" y="155" fill="#d4d4d8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">&#x2022; Profile appears as 'User not found'</text>
  </g>
</svg>