<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="How to cancel and revoke unauthorized UPI AutoPay mandates in GPay, PhonePe, and Paytm">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1ec"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1120" cy="70" r="180" fill="#e64a19" opacity="0.08"/>
  <circle cx="80" cy="620" r="160" fill="#e64a19" opacity="0.06"/>
  
  <!-- Left Header -->
  <text x="70" y="140" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#b83310" letter-spacing="3">UPI SECURITY &amp; FRAUD PREVENTION</text>
  <text x="70" y="225" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" fill="#0f172a">UPI AutoPay Scams:</text>
  <text x="70" y="295" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" fill="#0f172a">How to Cancel &amp;</text>
  <text x="70" y="365" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" fill="#e64a19">Revoke Mandates</text>
  <text x="70" y="425" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#475569">Stop unauthorized monthly deductions on GPay, PhonePe &amp; Paytm</text>
  
  <!-- Badges -->
  <g transform="translate(70 475)">
    <rect width="175" height="46" rx="23" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="87" y="29" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Google Pay</text>
    <rect x="190" width="175" height="46" rx="23" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="277" y="29" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0f172a">PhonePe</text>
    <rect x="380" width="175" height="46" rx="23" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="467" y="29" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Paytm UPI</text>
  </g>
  
  <!-- Alert Banner -->
  <g transform="translate(70 545)">
    <rect width="530" height="44" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="20" y="28" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#b91c1c">&#x26A0; Entering UPI PIN never receives money &#x2014; it approves an AutoPay mandate</text>
  </g>
  
  <!-- Right Column / Mandate Revoke Visual Card -->
  <g transform="translate(680 75)" filter="url(#shadow)">
    <rect width="460" height="480" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect width="460" height="60" rx="24" fill="#0f172a"/>
    <rect y="35" width="460" height="25" fill="#0f172a"/>
    <text x="25" y="38" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" fill="#ffffff">AUTOPAY MANDATE INSPECTOR</text>
    <circle cx="425" cy="35" r="8" fill="#e64a19"/>
    
    <!-- App 1: Google Pay -->
    <g transform="translate(25 85)">
      <rect width="410" height="85" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="20" y="30" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Google Pay (GPay)</text>
      <text x="20" y="52" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">Profile (Top Right) &gt; Autopay &gt; Select &gt; Cancel</text>
      <rect x="300" y="24" width="95" height="34" rx="8" fill="#fee2e2" stroke="#fca5a5"/>
      <text x="347" y="46" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" fill="#b91c1c">REVOKE</text>
    </g>
    
    <!-- App 2: PhonePe -->
    <g transform="translate(25 185)">
      <rect width="410" height="85" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="20" y="30" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0f172a">PhonePe</text>
      <text x="20" y="52" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">Profile &gt; Payment Management &gt; AutoPay Settings</text>
      <rect x="300" y="24" width="95" height="34" rx="8" fill="#fee2e2" stroke="#fca5a5"/>
      <text x="347" y="46" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" fill="#b91c1c">REMOVE</text>
    </g>
    
    <!-- App 3: Paytm -->
    <g transform="translate(25 285)">
      <rect width="410" height="85" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="20" y="30" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Paytm</text>
      <text x="20" y="52" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">Profile &gt; UPI &amp; Payment Settings &gt; Automatic Payments</text>
      <rect x="300" y="24" width="95" height="34" rx="8" fill="#fee2e2" stroke="#fca5a5"/>
      <text x="347" y="46" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" fill="#b91c1c">CANCEL</text>
    </g>
    
    <!-- Bottom note -->
    <rect x="25" y="390" width="410" height="65" rx="10" fill="#f0fdf4" stroke="#86efac"/>
    <text x="40" y="415" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#166534">&#x2713; NPCI Safe Revocation</text>
    <text x="40" y="438" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">Requires entering your UPI PIN once to sign the cancel order</text>
  </g>
</svg>