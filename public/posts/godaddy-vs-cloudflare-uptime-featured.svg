<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#f97316" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.06" stroke="#f97316" stroke-width="1">
    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="350" y1="0" x2="350" y2="630" />
    <line x1="550" y1="0" x2="550" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="950" y1="0" x2="950" y2="630" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="440" x2="1200" y2="440" />
  </g>

  <!-- Header Badge -->
  <g transform="translate(80, 75)">
    <rect width="310" height="38" rx="19" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-width="1.5" />
    <circle cx="22" cy="19" r="6" fill="#f97316" />
    <text x="40" y="24" fill="#fb923c" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1">HOSTING BENCHMARK SERIES • PART 6</text>
  </g>

  <!-- Title and Subtitle -->
  <g transform="translate(80, 165)">
    <text fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" line-height="1.2">
      <tspan x="0" y="0">GoDaddy vs Cloudflare Pages:</tspan>
      <tspan x="0" y="58" fill="#38bdf8">14-Day Speed, Latency &amp; Uptime Test</tspan>
    </text>
    <text x="0" y="125" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">
      Real UptimeRobot Logs, Global TTFB Latency (India/US/EU) &amp; Core Web Vitals
    </text>
  </g>

  <!-- Side-by-Side Comparison Matrix -->
  <g transform="translate(80, 345)" filter="url(#glow)">
    <rect width="1040" height="215" rx="18" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />

    <!-- Left Box: GoDaddy cPanel -->
    <g transform="translate(30, 22)">
      <rect width="470" height="170" rx="14" fill="#1e293b" fill-opacity="0.5" stroke="#ef4444" stroke-width="1.2" stroke-opacity="0.5" />
      <rect x="20" y="18" width="130" height="26" rx="6" fill="#ef4444" fill-opacity="0.2" />
      <text x="85" y="35" text-anchor="middle" fill="#f87171" font-family="system-ui, sans-serif" font-size="12" font-weight="700">GODADDY CPANEL</text>
      
      <!-- Metrics -->
      <g transform="translate(20, 68)">
        <text x="0" y="0" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">14-Day Uptime:</text>
        <text x="200" y="0" fill="#f87171" font-family="system-ui, sans-serif" font-size="14" font-weight="700">99.18% (42m Down)</text>
        
        <text x="0" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Avg TTFB (India):</text>
        <text x="200" y="32" fill="#fb923c" font-family="system-ui, sans-serif" font-size="14" font-weight="700">740ms &#x2013; 1,220ms</text>
        
        <text x="0" y="64" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Monthly Cost:</text>
        <text x="200" y="64" fill="#ef4444" font-family="system-ui, sans-serif" font-size="14" font-weight="700">₹1,199 / mo</text>
      </g>
    </g>

    <!-- Right Box: Cloudflare Pages -->
    <g transform="translate(540, 22)">
      <rect width="470" height="170" rx="14" fill="#1e293b" fill-opacity="0.5" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.7" />
      <rect x="20" y="18" width="150" height="26" rx="6" fill="#10b981" fill-opacity="0.2" />
      <text x="95" y="35" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">CLOUDFLARE PAGES</text>
      
      <!-- Metrics -->
      <g transform="translate(20, 68)">
        <text x="0" y="0" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">14-Day Uptime:</text>
        <text x="200" y="0" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="700">100.00% (0s Down)</text>
        
        <text x="0" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Avg TTFB (India):</text>
        <text x="200" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">38ms &#x2013; 62ms (19x Faster)</text>
        
        <text x="0" y="64" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Monthly Cost:</text>
        <text x="200" y="64" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="700">₹0 / mo (Free Tier)</text>
      </g>
    </g>
  </g>

  <!-- Footer Branding -->
  <g transform="translate(80, 590)">
    <text fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">TrendsWheel Case Study • Real Unbiased UptimeRobot &amp; PageSpeed Insights Data</text>
  </g>
</svg>
