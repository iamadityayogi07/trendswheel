    <circle cx="48" cy="48" r="24" fill="#e879f9" fill-opacity="0.2" />
    <text x="48" y="55" fill="#e879f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" text-anchor="middle">2</text>
