<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18" />
      <stop offset="50%" stop-color="#141829" />
      <stop offset="100%" stop-color="#04060d" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#ef4444" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Abstract smartphone chassis outline -->
  <g opacity="0.06" stroke="#94a3b8" stroke-width="2" fill="none">
    <rect x="250" y="50" width="700" height="530" rx="36" />
    <circle cx="280" cy="80" r="12" stroke="#ef4444" />
    <line x1="270" y1="70" x2="290" y2="90" stroke="#ef4444" stroke-width="2" />
  </g>

  <!-- Header Badge -->
  <g transform="translate(80, 75)">
    <rect width="300" height="38" rx="19" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1.5" />
    <circle cx="22" cy="19" r="6" fill="#f87171" />
    <text x="40" y="24" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1">SMARTPHONE DESIGN EXPLAINER</text>
  </g>

  <!-- Title and Subtitle -->
  <g transform="translate(80, 165)">
    <text fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" line-height="1.2">
      <tspan x="0" y="0">Why Flagship Phones Removed the</tspan>
      <tspan x="0" y="58" fill="#38bdf8">Headphone Jack &amp; MicroSD Card Slot</tspan>
    </text>
    <text x="0" y="125" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">
      UFS 4.0 Bottlenecks, Internal Haptic Volumes and the Multi-Billion Dollar TWS Upsell
    </text>
  </g>

  <!-- 3 Real Reasons Matrix Card -->
  <g transform="translate(80, 345)" filter="url(#softGlow)">
    <rect width="1040" height="215" rx="18" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
    
    <!-- Box 1 -->
    <g transform="translate(30, 22)">
      <rect width="305" height="170" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="1" />
      <rect x="18" y="18" width="115" height="24" rx="6" fill="#ef4444" fill-opacity="0.2" />
      <text x="75" y="34" text-anchor="middle" fill="#f87171" font-family="system-ui, sans-serif" font-size="11" font-weight="700">THE FINANCIAL MOTIVE</text>
      <text x="18" y="70" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600">The $30 Billion Upsell</text>
      <text x="18" y="94" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">No jack forces users to buy</text>
      <text x="18" y="118" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">wireless earbuds and cloud</text>
      <text x="18" y="142" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="12">subscriptions for extra storage.</text>
    </g>

    <!-- Box 2 -->
    <g transform="translate(365, 22)">
      <rect width="305" height="170" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#0284c7" stroke-width="1.5" />
      <rect x="18" y="18" width="125" height="24" rx="6" fill="#0284c7" fill-opacity="0.25" />
      <text x="80" y="34" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">TECHNICAL REALITY</text>
      <text x="18" y="70" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="600">UFS 4.0 vs MicroSD Bottleneck</text>
      <text x="18" y="94" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Internal flash runs at 4200MB/s.</text>
      <text x="18" y="118" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">A 60MB/s SD card causes camera</text>
      <text x="18" y="142" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12">app crashes during 4K 60fps recording.</text>
    </g>

    <!-- Box 3 -->
    <g transform="translate(700, 22)">
      <rect width="310" height="170" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="1" />
      <rect x="18" y="18" width="130" height="24" rx="6" fill="#10b981" fill-opacity="0.2" />
      <text x="83" y="34" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">PHYSICAL ARCHITECTURE</text>
      <text x="18" y="70" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Internal Real Estate</text>
      <text x="18" y="94" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">A 3.5mm jack takes massive</text>
      <text x="18" y="118" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">depth. Removing it allowed</text>
      <text x="18" y="142" fill="#34d399" font-family="system-ui, sans-serif" font-size="12">larger haptics and 5,000mAh cells.</text>
    </g>
  </g>

  <!-- Footer Branding -->
  <g transform="translate(80, 590)">
    <text fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">TrendsWheel Tech Explainer &#x2022; Engineering Design Realities Behind Flagship Smartphones</text>
  </g>
</svg>
