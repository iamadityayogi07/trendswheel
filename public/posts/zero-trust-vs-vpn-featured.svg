<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#38bdf8" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Network Topology Lines -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1.5" fill="none">
    <circle cx="200" cy="180" r="10" />
    <circle cx="600" cy="180" r="14" />
    <circle cx="1000" cy="180" r="10" />
    <line x1="210" y1="180" x2="586" y2="180" />
    <line x1="614" y1="180" x2="990" y2="180" />
  </g>

  <!-- Header Badge -->
  <g transform="translate(80, 75)">
    <rect width="320" height="38" rx="19" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-width="1.5" />
    <circle cx="22" cy="19" r="6" fill="#38bdf8" />
    <text x="40" y="24" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1">CYBERSECURITY ARCHITECTURE</text>
  </g>

  <!-- Title and Subtitle -->
  <g transform="translate(80, 165)">
    <text fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" line-height="1.2">
      <tspan x="0" y="0">Why Corporate VPNs Are Dead:</tspan>
      <tspan x="0" y="58" fill="#38bdf8">Understanding Zero Trust &amp; SASE</tspan>
    </text>
    <text x="0" y="125" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">
      Castle-and-Moat Vulnerabilities, Lateral Movement and Modern ZTNA Replacement
    </text>
  </g>

  <!-- Split Comparison Card -->
  <g transform="translate(80, 345)" filter="url(#softGlow)">
    <rect width="1040" height="215" rx="18" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
    
    <!-- Left Box: Legacy VPN -->
    <g transform="translate(30, 22)">
      <rect width="470" height="170" rx="14" fill="#1e293b" fill-opacity="0.5" stroke="#ef4444" stroke-width="1.2" stroke-opacity="0.6" />
      <rect x="20" y="18" width="165" height="26" rx="6" fill="#ef4444" fill-opacity="0.2" />
      <text x="102" y="35" text-anchor="middle" fill="#f87171" font-family="system-ui, sans-serif" font-size="12" font-weight="700">LEGACY CORPORATE VPN</text>
      
      <g transform="translate(20, 68)">
        <text x="0" y="0" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Trust Model:</text>
        <text x="180" y="0" fill="#f87171" font-family="system-ui, sans-serif" font-size="14" font-weight="700">&quot;Castle and Moat&quot; (Insecure)</text>
        
        <text x="0" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Lateral Movement:</text>
        <text x="180" y="32" fill="#f87171" font-family="system-ui, sans-serif" font-size="14" font-weight="700">ALLOWED across whole subnet</text>
        
        <text x="0" y="64" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Routing / Traffic:</text>
        <text x="180" y="64" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Hairpinned through HQ DC</text>
      </g>
    </g>

    <!-- Right Box: Modern Zero Trust -->
    <g transform="translate(540, 22)">
      <rect width="470" height="170" rx="14" fill="#1e293b" fill-opacity="0.5" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.8" />
      <rect x="20" y="18" width="175" height="26" rx="6" fill="#10b981" fill-opacity="0.2" />
      <text x="107" y="35" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">ZERO TRUST (ZTNA / SASE)</text>
      
      <g transform="translate(20, 68)">
        <text x="0" y="0" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Trust Model:</text>
        <text x="180" y="0" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="700">&quot;Never Trust, Always Verify&quot;</text>
        
        <text x="0" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Lateral Movement:</text>
        <text x="180" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">BLOCKED (Micro-segmentation)</text>
        
        <text x="0" y="64" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Routing / Traffic:</text>
        <text x="180" y="64" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Direct Anycast Edge Proxy</text>
      </g>
    </g>
  </g>

  <!-- Footer Branding -->
  <g transform="translate(80, 590)">
    <text fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">TrendsWheel Tech Architectural Analysis &#x2022; Cloudflare Zero Trust, Zscaler &amp; Tailscale</text>
  </g>
</svg>
