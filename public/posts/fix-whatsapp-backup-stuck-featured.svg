    <tspan x="140" dy="0">Deconstructing Google Drive AppData container permissions, cryptographic manifest validation,</tspan>
    <tspan x="140" dy="30">corrupt video header isolation, Google Play Services token flushes, and local database sync.</tspan>
  </text>
